name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/**"

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/autopilot-app:${{ github.sha }}

      # Security scanning BEFORE pushing to registry - fail the build on
      # critical vulnerabilities so bad images never reach production.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/autopilot-app:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autopilot-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/autopilot-app:latest

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            kubectl set image deployment/autopilot-app \
              autopilot-app=${{ secrets.DOCKERHUB_USERNAME }}/autopilot-app:${{ github.sha }} \
              -n autopilot-ops
            kubectl rollout status deployment/autopilot-app -n autopilot-ops --timeout=120s
