# The remediation bot needs specific RBAC permissions to restart/rollback
# deployments and delete pods - scoped ONLY to the autopilot-ops namespace,
# following least-privilege principle.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-bot-sa
  namespace: autopilot-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-bot-role
  namespace: autopilot-ops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/rollback"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-bot-binding
  namespace: autopilot-ops
subjects:
  - kind: ServiceAccount
    name: remediation-bot-sa
    namespace: autopilot-ops
roleRef:
  kind: Role
  name: remediation-bot-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-bot
  namespace: autopilot-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-bot
  template:
    metadata:
      labels:
        app: remediation-bot
    spec:
      serviceAccountName: remediation-bot-sa
      containers:
        - name: remediation-bot
          image: <YOUR_DOCKERHUB_USERNAME>/remediation-bot:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET_NAMESPACE
              value: autopilot-ops
            - name: TARGET_DEPLOYMENT
              value: autopilot-app
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: remediation-secrets
                  key: slack-webhook-url
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-bot
  namespace: autopilot-ops
spec:
  selector:
    app: remediation-bot
  ports:
    - port: 8080
      targetPort: 8080
